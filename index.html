<html lang="en">

<title>Client Onboarding | Be Your Own Star</title>

<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#16130f;--muted:#6b645a;--line:#e6dfd3;--gold:#b8923a;--gold-d:#8f6f26;--err:#b3261e;--ok:#2f6b3f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12100d;--card:#1b1814;--ink:#f3eee6;--muted:#a79f92;--line:#322d25;--gold:#d3ad5b;--gold-d:#e2c27c;--err:#ff8a80;--ok:#7fcf92}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:28px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:600 26px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.02em}
.brand span{color:var(--gold)}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.lang button[aria-pressed=true]{border-color:var(--gold);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;margin-top:18px}
h1{font:600 34px/1.15 "Cormorant Garamond",Georgia,serif;margin:0 0 8px}
h2{font:600 26px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 22px}
.progress{display:flex;gap:6px;margin:18px 0 0}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--gold)}
.steplabel{color:var(--muted);font-size:13px;margin-top:8px}
.field{margin:0 0 20px}
label,.lbl{display:block;font-weight:500;margin-bottom:4px}
.req{color:var(--gold-d)}
.hint{color:var(--muted);font-size:14px;margin:0 0 6px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:104px;resize:vertical}
input[type=date]{max-width:260px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.err{color:var(--err);font-size:14px;margin-top:4px;display:none}
.field.bad .err{display:block}.field.bad input,.field.bad textarea,.field.bad select{border-color:var(--err)}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:12px 26px;border:1px solid var(--gold);cursor:pointer;background:var(--gold);color:#fff}
.btn:hover{background:var(--gold-d)}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--gold)}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.file .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;width:90px}
.bar b{display:block;height:100%;width:0;background:var(--gold)}
.file button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px}
.note{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 14px;font-size:14px;margin-top:10px}
.sum section{border-top:1px solid var(--line);padding:14px 0}
.sum h3{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.sum h3 button{background:none;border:0;color:var(--gold-d);cursor:pointer;font:inherit;font-size:14px;text-decoration:underline}
.sum dl{margin:0;display:grid;grid-template-columns:minmax(120px,32%) 1fr;gap:6px 14px;font-size:14px}
.sum dt{color:var(--muted)}.sum dd{margin:0;white-space:pre-wrap;word-break:break-word}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
.check input{margin-top:5px;width:18px;height:18px;accent-color:var(--gold)}
.aprow{margin:0 0 10px}.aplab{font-size:13px;color:var(--muted);margin-bottom:4px}
.apgrid{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;align-items:center}
.apgrid .rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:20px}
.btn.small{padding:8px 18px;font-size:14px}.note a{color:var(--gold-d)}
#frm .note{margin:0 0 20px}
@media (max-width:560px){.apgrid{grid-template-columns:1fr 34px}.apgrid input[type=email]{grid-column:1}}
.est{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:6px 0 20px}
.est table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
.est td{padding:5px 0;border-bottom:1px solid var(--line)}.est td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.est .tot td{font-weight:600;border-bottom:0;padding-top:9px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.banner{padding:12px 16px;border-radius:10px;margin-top:18px;border:1px solid var(--line);background:var(--card)}
.banner.warn{border-color:var(--gold)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}.modal div{background:var(--card);border-radius:14px;padding:24px;max-width:440px}
.done{text-align:center;padding:30px 8px}.done .tick{font-size:42px;color:var(--ok)}
@media (max-width:560px){.card{padding:20px}h1{font-size:28px}.sum dl{grid-template-columns:1fr}}
</style>
</head>

  if(!keep)window.scrollTo({top:0,behavior:"smooth"});
}
const vis=f=>!f.show||f.show(answers);
const EMAILRE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  const mail=`<a href="mailto:${esc(CONFIG.CONTACT_EMAIL)}">${esc(CONFIG.CONTACT_EMAIL)}</a>`;

const optsOf=f=>typeof f.o==="function"?f.o(answers):f.o;
/* ---- live price estimate (indicative; we confirm the final quote) ---- */
function estimate(lg){
  const A=answers,lines=[];let total=0,pending=false;
  const b=PRICING.bundles.find(x=>bLabel(x,"en")===A.bundle);
  if(b){lines.push([b[lg],b.price]);total+=b.price;
    if((A.first_project||"").startsWith("No")){lines.push([lg==="de"?"Folgeprojekt: reduzierte Einrichtung":"Repeat project: reduced set-up",-b.refresh]);total-=b.refresh}}
  else if(A.bundle)pending=true;
  if((A.followup||"").startsWith("Yes")){lines.push([lg==="de"?"Erinnerungs-E-Mail nach 7 Tagen":"7-day follow-up email",PRICING.followup]);total+=PRICING.followup}
  const n=parseInt(A.lang_count||"1",10)||1;
  if(n>1){lines.push([lg==="de"?`${n-1} zusätzliche Sprache(n)`:`${n-1} additional language${n-1>1?"s":""}`,(n-1)*PRICING.language]);total+=(n-1)*PRICING.language}
  const ar=routeOf(A)==="build"?(parseInt(A.areas||"0",10)||0):0;
  if(ar>0){lines.push([lg==="de"?`${ar} zusätzliche(r) Suchbereich(e)`:`${ar} additional search area${ar>1?"s":""}`,ar*PRICING.area]);total+=ar*PRICING.area}
  const more=/or more|mehr/.test((A.lang_count||"")+" "+(A.areas||""));
  return {lines,total,pending,more};
}
function estimateHtml(){
  const e=estimate(lang);
  if(!e.lines.length&&!e.pending)return `<div class="est"><b>${t("estTitle")}</b><p class="hint" style="margin:6px 0 0">${t("estEmpty")}</p></div>`;
  const rows=e.lines.map(([l,a])=>`<tr><td>${esc(l)}</td><td>${a<0?"−":""}${money(Math.abs(a))}</td></tr>`).join("");
  const total=e.pending?`<tr class="tot"><td>${t("estPending")}</td><td>${e.lines.length?"+ "+money(e.total):""}</td></tr>`:`<tr class="tot"><td>${t("estTotal")}${e.more?" ("+t("estMore")+")":""}</td><td>${money(e.total)}</td></tr>`;
  return `<div class="est"><b>${t("estTitle")}</b><table>${rows}${total}</table><p class="hint" style="margin:8px 0 0">${t("estNote")}</p></div>`;
}
function estimateText(){
  const e=estimate("en");const L=e.lines.map(([l,a])=>`${l}: ${a<0?"-":""}${money(Math.abs(a))}`);
  L.push(e.pending?"Bundle: client asked us to pick the best bundle. Quote to be confirmed.":`Estimated total: ${money(e.total)}${e.more?" (more languages or areas to be confirmed)":""}`);
  return L.join("\n");
}
function fieldHtml(f){
  if(!vis(f))return "";
  if(f.type==="note")return noteHtml(f);
  if(f.type==="estimate")return estimateHtml();
  if(f.type==="files")return filesHtml(f);
  if(f.type==="approvers")return approversHtml(f);
  const v=answers[f.id]??"";
  const label=f.l?`<label for="f_${f.id}">${esc(f.l[lang])}${f.req?' <span class="req">*</span>':""}</label>`:"";
  const hint=f.h?`<p class="hint">${esc(f.h[lang])}</p>`:"";
  const ph=f.ph?` placeholder="${esc(f.ph[lang])}"`:"";
  let ctl="";
  if(f.type==="area")ctl=`<textarea id="f_${f.id}" data-id="${f.id}" maxlength="5000"${ph}>${esc(v)}</textarea>`;
  else if(f.type==="select")ctl=`<select id="f_${f.id}" data-id="${f.id}"><option value="">${t("choose")}</option>${(o=>o[lang].map((x,i)=>`<option value="${esc(o.en[i])}" ${v===o.en[i]?"selected":""}>${esc(x)}</option>`).join(""))(optsOf(f))}</select>`;
  else if(f.type==="date")ctl=`<input id="f_${f.id}" data-id="${f.id}" type="date" min="${new Date().toISOString().slice(0,10)}" value="${esc(v)}">`;
  else ctl=`<input id="f_${f.id}" data-id="${f.id}" type="${f.type==="url"?"text":f.type}" ${f.type==="url"?'inputmode="url"':""} maxlength="500" value="${esc(v)}"${ph} autocomplete="${f.id==="email"?"email":f.id==="name"?"name":f.id==="phone"?"tel":"off"}">`;
  return `<div class="field" data-field="${f.id}">${label}${hint}${ctl}<div class="err"></div></div>`;
}
function approversHtml(f){
  const list=answers.approvers&&answers.approvers.length?answers.approvers:(answers.approvers=[{name:"",email:""}]);
  return `<div class="field" data-field="approvers"><span class="lbl">${esc(f.l[lang])} <span class="req">*</span></span>${f.h?`<p class="hint">${esc(f.h[lang])}</p>`:""}
  ${list.map((a,i)=>`<div class="aprow"><div class="aplab">${i===0?t("mainApprover"):t("extraApprover")}</div><div class="apgrid">
   <input type="text" data-apf="name" data-api="${i}" placeholder="${t("approverName")}" aria-label="${t("approverName")}" value="${esc(a.name)}" maxlength="120" autocomplete="off">
   <input type="email" data-apf="email" data-api="${i}" placeholder="${t("approverEmail")}" aria-label="${t("approverEmail")}" value="${esc(a.email)}" maxlength="200" autocomplete="off">
   ${i?`<button type="button" class="rm" data-aprm="${i}" aria-label="remove">×</button>`:'<span></span>'}</div></div>`).join("")}
  ${list.length<4?`<button type="button" class="btn ghost small" id="apadd">${t("addApprover")}</button>`:""}<div class="err"></div></div>`;
}
function filesHtml(f){
  return `<div class="field"><span class="lbl">${esc(f.l[lang])}</span><p class="hint">${esc(f.h[lang])}</p><p class="hint">${t("filesLimit")(CONFIG.MAX_FILE_MB,CONFIG.MAX_TOTAL_MB,CONFIG.MAX_FILES)}</p>
  <div class="drop" id="drop" tabindex="0" role="button">${t("filesHint")}</div><input id="pick" type="file" multiple hidden accept="${CONFIG.ALLOWED_EXT.map(e=>"."+e).join(",")}">

function fileRow(f,i){return `<div class="file" data-i="${i}"><span class="n">${esc(f.file.name)} · ${mb(f.file.size)} MB</span><span class="bar"><b style="width:${f.pct||0}%"></b></span><button type="button" aria-label="remove" data-rm="${i}">×</button></div>`}

function renderWelcome(){
  shell(`<h1>${(PROJECTS[client.project].title||T("Tell us about your project","Erzählen Sie uns von Ihrem Projekt"))[lang]}</h1>${client.name?`<p class="sub" style="margin-bottom:6px;color:var(--ink)">${lang==="de"?"Hallo":"Hi"} ${esc(client.name)},</p>`:""}<p class="sub">${t("welcome")}</p>
  ${PREPARE[client.project]?`<div class="note"><b>${t("ready")}</b><ul style="margin:6px 0 0;padding-left:20px">${PREPARE[client.project][lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
  <div class="actions"><span></span><button class="btn" id="go">${t("start")}</button></div>`,0,0);
  $("#go").onclick=()=>renderStep(0);
}
function renderStep(i,keep,focusId){
  step=i;const sec=Q[client.project][i],n=Q[client.project].length;
  shell(`<h2>${esc(sec.t[lang])}</h2><p class="sub">${sec.intro?esc(sec.intro[lang]):""}</p><form id="frm" novalidate>${sec.f.map(fieldHtml).join("")}</form>
  <div class="actions"><button class="btn ghost" id="bk">${t("back")}</button><button class="btn" id="nx">${t("next")}</button></div>`,i,n+1,keep);
  if(focusId)$("#f_"+focusId)?.focus({preventScroll:true});
  const frm=$("#frm");
  frm.addEventListener("input",e=>{
    const d=e.target.dataset;
    if(d.apf){answers.approvers[+d.api][d.apf]=e.target.value;save();return}
    if(d.id){answers[d.id]=e.target.value;save();
      const f=sec.f.find(x=>x.id===d.id);if(f&&f.reset)f.reset.forEach(k=>delete answers[k]);if(f&&f.rr)renderStep(i,true,d.id)}   // show or hide dependent questions
  });
  frm.addEventListener("click",e=>{
    if(e.target.id==="apadd"){answers.approvers.push({name:"",email:""});save();renderStep(i,true)}
    if(e.target.dataset.aprm){answers.approvers.splice(+e.target.dataset.aprm,1);save();renderStep(i,true)}
  });
  // Enter in a text field must act like "Next", never reload the page (which dropped people back at the start).
  frm.addEventListener("submit",e=>{e.preventDefault();$("#nx").click()});
  $("#bk").onclick=()=>i?renderStep(i-1):renderWelcome();
  $("#nx").onclick=()=>{if(validate(sec))(i+1<n)?renderStep(i+1):renderReview()};
  wireFiles();
}
function approversError(){
  const rows=(answers.approvers||[]).map(a=>({name:(a.name||"").trim(),email:(a.email||"").trim()}));
  const [first,...rest]=rows;
  if(!first||!first.name||!first.email)return {msg:t("required")};
  if(!EMAILRE.test(first.email))return {msg:t("badEmail")};
  const extra=rest.filter(a=>a.name||a.email);
  for(const a of extra){if(!a.name||!a.email)return {msg:t("required")};if(!EMAILRE.test(a.email))return {msg:t("badEmail")}}
  return {clean:[first,...extra]};
}
function validate(sec){
  let ok=true;
  for(const f of sec.f){if(!vis(f)||f.type==="files"||f.type==="note"||f.type==="estimate")continue;
    const el=$(`[data-field="${f.id}"]`);if(!el)continue;let msg="";
    if(f.type==="approvers"){const r=approversError();if(r.clean)answers.approvers=r.clean;else msg=r.msg}
    else{const v=(answers[f.id]||"").trim();
      if(f.req&&!v)msg=t("required");else if(f.type==="email"&&v&&!EMAILRE.test(v))msg=t("badEmail");
      else if(f.type==="date"&&v&&!/^\d{4}-\d{2}-\d{2}$/.test(v))msg=t("required");}
    el.classList.toggle("bad",!!msg);$(".err",el).textContent=msg;if(msg)ok=false;}
  if(!ok)$(".bad input,.bad textarea,.bad select")?.focus();
  return ok;
}

function wireFiles(){
  const drop=$("#drop");if(!drop)return;const pick=$("#pick");
  drop.onclick=()=>pick.click();drop.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick.click()}};
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));pick.onchange=()=>{addFiles(pick.files);pick.value=""};
  $("#flist").onclick=e=>{const i=e.target.dataset.rm;if(i!==undefined){files.splice(+i,1);$("#flist").innerHTML=files.map(fileRow).join("")}};
}
function bigFileModal(){
  $("#modalMsg").textContent=t("modalBig");const a=$("#modalMail");a.textContent=t("modalMail");
  a.href="mailto:"+CONFIG.CONTACT_EMAIL+"?subject="+encodeURIComponent("Files for my onboarding");$("#modalClose").textContent=t("close");$("#modal").classList.add("on");
}
$("#modalClose").onclick=()=>$("#modal").classList.remove("on");
function addFiles(list){
  const err=$("#ferr");err.textContent="";
  for(const f of list){
    if(files.length>=CONFIG.MAX_FILES){err.textContent=t("tooMany");break}
    if(!CONFIG.ALLOWED_EXT.includes(ext(f.name))){err.textContent=t("badType")(f.name);continue}
    if(f.size>CONFIG.MAX_FILE_MB*1048576){err.textContent=t("tooBig")(f.name);bigFileModal();continue}
    if(files.reduce((s,x)=>s+x.file.size,0)+f.size>CONFIG.MAX_TOTAL_MB*1048576){err.textContent=t("totalBig");bigFileModal();continue}
    files.push({file:f,pct:0});
  }
  $("#flist").innerHTML=files.map(fileRow).join("");
}

function fmtDate(v,lg){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);if(!m||lg==="en")return v;return `${+m[3]}.${+m[2]}.${m[1]}`}
function display(f,lg){
  const raw=answers[f.id]||"";
  if(f.type==="approvers")return (answers.approvers||[]).filter(a=>a.name||a.email).map((a,i)=>`${i+1}. ${a.name} <${a.email}>${i===0?(lg==="de"?" (Hauptentscheidung)":" (main decision-maker)"):""}`).join("\n");
  if(f.type==="select"&&raw){const o=optsOf(f);return o[lg][o.en.indexOf(raw)]||raw}
  if(f.type==="date")return fmtDate(raw,lg);
  return raw;
}
function entries(sec,lg){return sec.f.filter(f=>vis(f)&&f.type!=="files"&&f.type!=="note"&&f.type!=="estimate").map(f=>({f,q:f.l[lg],a:display(f,lg)}))}
function renderReview(){
  const secs=Q[client.project];
  const body=secs.map((s,i)=>{
    const rows=entries(s,lang).map(({q,a})=>`<dt>${esc(q)}</dt><dd>${a?esc(a):'<span style="color:var(--muted)">'+t("none")+"</span>"}</dd>`).join("");
    const fl=s.f.some(f=>f.type==="files")&&files.length?`<dt>${esc(s.f.find(f=>f.type==="files").l[lang])}</dt><dd>${files.map(x=>esc(x.file.name)).join("\n")}</dd>`:"";
    return `<section><h3>${esc(s.t[lang])}<button type="button" data-edit="${i}">${t("edit")}</button></h3><dl>${rows}${fl}</dl></section>`}).join("");
  shell(`<h2>${t("review")}</h2><p class="sub">${t("reviewSub")}</p><div class="sum">${body}</div>
  ${estimateHtml()}
  <div class="note"><b>${t("privacy")}.</b> ${t("privacyText")}</div>
  <label class="check"><input type="checkbox" id="consent"><span>${t("consent")}</span></label><div class="err" id="cerr" style="display:none">${t("required")}</div>
  <div class="hp" aria-hidden="true"><label>Website <input id="hp" tabindex="-1" autocomplete="off"></label></div>
  <div class="actions"><button class="btn ghost" id="bk">${t("back")}</button><button class="btn" id="send">${t("send")}</button></div><div class="err" id="serr" style="display:none"></div>`,secs.length,secs.length+1);
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>renderStep(+b.dataset.edit));
  $("#bk").onclick=()=>renderStep(secs.length-1);
  $("#send").onclick=submit;
}

function showErr(id,msg){const e=$(id);e.textContent=msg;e.style.display=msg?"block":"none"}

async function uploadOne(item){
  const f=item.file;
  const s=await api({action:"start_upload",name:f.name,size:f.size,type:f.type||"application/octet-stream"});
  if(!s.ok)throw new Error(s.error||"start");
  if(DEMO){for(let p=0;p<=100;p+=25){item.pct=p;updateBars();await new Promise(r=>setTimeout(r,120))}return}
  await new Promise((res,rej)=>{
    const x=new XMLHttpRequest();x.open("PUT",s.uploadUrl);
    x.upload.onprogress=e=>{if(e.lengthComputable){item.pct=Math.round(e.loaded/e.total*100);updateBars()}};
    x.onload=()=>(x.status>=200&&x.status<300)?res():rej(new Error("upload "+x.status));x.onerror=()=>rej(new Error("network"));x.send(f);
  });
}
function updateBars(){document.querySelectorAll(".file .bar b").forEach((b,i)=>{if(files[i])b.style.width=files[i].pct+"%"})}

async function submit(){
  if(sending)return;
  if(!$("#consent").checked){showErr("#cerr",t("required"));$("#cerr").style.display="block";return}
  sending=true;const btn=$("#send");btn.disabled=true;btn.textContent=t("sending");showErr("#serr","");
  try{
    // show per-file progress on the review page
    const list=document.createElement("div");list.innerHTML=files.map(fileRow).join("");btn.parentElement.after(list);
    for(const it of files){ if(it.done)continue; await uploadOne(it); it.done=true; it.pct=100; updateBars(); }
  }catch(e){sending=false;btn.disabled=false;btn.textContent=t("send");showErr("#serr",t("uploadFail"));bigFileModal();return}
  try{
    // drop answers to questions that are hidden by an earlier choice, so stale text is never saved
    Q[client.project].forEach(sec=>sec.f.forEach(f=>{if(!vis(f)){delete answers[f.id]}}));
    const qa=[];Q[client.project].forEach(sec=>entries(sec,"en").forEach(({q,a})=>qa.push({section:sec.t.en,question:q,answer:a})));
    qa.push({section:"Your package",question:"Estimate shown to the client (indicative, not a quote)",answer:estimateText()});
    const r=await api({action:"submit",lang,answers,qa,files:files.map(f=>({name:f.file.name,size:f.file.size})),
      consent:true,hp:$("#hp").value,elapsedMs:Date.now()-started});
    if(!r.ok)throw new Error(r.error||"submit");
    clearSaved();
    shell(`<div class="done"><div class="tick">✓</div><h2>${t("doneTitle")}</h2><p class="sub">${t("doneText")}</p></div>`,0,0);
  }catch(e){sending=false;btn.disabled=false;btn.textContent=t("send");showErr("#serr",t("submitFail"))}
}

/* Package chosen on proposal.html arrives as ?pkg={r,w,fu,l,a,rep,best}. Applied once per link. */
function applyPkg(){
  const raw=params.get("pkg");if(!raw||answers._pkgApplied===raw)return;
  let p;try{p=JSON.parse(raw)}catch(e){return}
  const f=id=>SEC.package.f.find(x=>x.id===id), opt=(id,i)=>f(id).o.en[i];
  const route=p.r==="own"?"own":"build", key={own2:"starter",own4:"standard",build2:"lgstarter",build4:"lgfull"}[route+(+p.w===2?2:4)];
  answers.list_choice=opt("list_choice",route==="own"?0:1);
  answers.bundle=p.best?PRICING.best.en:bLabel(PRICING.bundles.find(b=>b.key===key),"en");
  answers.followup=opt("followup",p.fu?0:1);
  answers.lang_count=opt("lang_count",Math.min(3,Math.max(0,(+p.l||1)-1)));
  if(route==="build")answers.areas=opt("areas",Math.min(3,Math.max(0,+p.a||0)));else delete answers.areas;
  answers.first_project=opt("first_project",p.rep?1:0);
  answers._pkgApplied=raw;save();
}
/* ----------------------------------- boot ----------------------------------- */
function setLang(l){lang=l;$("#lEN").setAttribute("aria-pressed",l==="en");$("#lDE").setAttribute("aria-pressed",l==="de");document.documentElement.lang=l;save();if(client)(step>=0&&$("#frm"))?renderStep(step):$("#send")?renderReview():renderWelcome()}
$("#lEN").onclick=()=>setLang("en");$("#lDE").onclick=()=>setLang("de");
(async()=>{
  loadSaved();applyPkg();if(params.get("lang")==="de"||params.get("lang")==="en")lang=params.get("lang");setLang(lang);
  const h=await hello();
  if(h.done){shell(`<div class="done"><div class="tick">✓</div><h2>${t("doneTitle")}</h2><p class="sub">${t("doneText")}</p></div>`,0,0);return}
  if(!h.ok||!Q[h.project||"general"]){shell(`<h2>${t("invalid")}</h2>`,0,0);return}
  client={name:h.name||"",project:h.project||"general"};if(h.lang&&!params.get("lang")&&!localStorage.getItem(KEY))setLang(h.lang);
  renderWelcome();
})();
</script>
